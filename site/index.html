<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konnect – First wash (D4 prototype)</title>
<style>
/* ============ DESIGN SYSTEM (D4 Part B2) ============
   Palette (from the team's 4-swatch palette): pink #F9B1B6, mauve #AD7099, violet #8A6499, indigo #3F3D8A.
   Text-bearing roles: indigo (brand, buttons, headings), pink (accent surfaces, text on it is dark indigo).
   Mauve is decorative only (white on mauve is 3.8:1, below 4.5:1). Semantic colours stay separate from the
   brand so state is never confused with decoration: success green, error red, caution amber.
   Type scale (3 levels): --t1 26px heading, --t2 20px sub/label, --t3 18px body (no text below 16px).
   Spacing scale: 4 / 8 / 16 / 24 / 32.

   HCI notes (Norman + Gestalt), also listed in CONTEXT.md:
   - Signifiers/affordances: raised pill buttons with a shadow read as pressable; chevrons show "go";
     the crosshair cursor and dashed ring show "tap here" on the camera view.
   - Constraints: Next stays greyed until the step is done. Feedback: every action gets a status box + announcement.
   - Mapping: the label sits under the part it names. Conceptual model: one ring-progress = where you are in 6 steps.
   - Gestalt: common region (white cards, caution box, status box), proximity (title+count+ring grouped),
     similarity (all primary actions indigo, all normal tags one style), figure-ground (white ring on camera),
     closure/continuity (circular progress, 4-band palette stripe), hierarchy (title > instruction > camera > caution > status > nav). */
:root{
  --pink:#F9B1B6; --pink-soft:#FDEBED; --mauve:#AD7099; --violet:#8A6499; --indigo:#3F3D8A; --indigo-dark:#2E2C6B;
  --ink:#1F1D3D; --muted:#55527A; --line:#D9D2E3; --surface:#FFFFFF; --bg:#F4EDF4;
  --brand:#3F3D8A; --brand-ink:#FFFFFF; --brand-dark:#2E2C6B;
  --ok:#14692F; --ok-bg:#E3F4E8;
  --warn:#7A5200; --warn-bg:#FFF4D1;
  --err:#B42318; --err-bg:#FDE8E6;
  --focus:#3F3D8A;
  --t1:26px; --t2:20px; --t3:18px;
  --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:32px;
  --r:16px; --shadow:0 2px 0 rgba(31,29,61,.18),0 6px 14px rgba(63,61,138,.22);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--t3)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Nastaliq Urdu","Noto Sans Arabic",sans-serif}
[lang="ur"] body, html[lang="ur"]{line-height:1.9}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--indigo)}
h1,h2,h3{margin:0}
h1{font-size:var(--t2);font-weight:700}
h2{font-size:var(--t1);font-weight:700;line-height:1.25;color:var(--indigo-dark)}
h3{font-size:var(--t2);font-weight:700}
p{margin:0 0 var(--s3)}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header: indigo hero + 4-band palette stripe */
header.top{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s3) var(--s5);color:#fff;
  background:linear-gradient(135deg,var(--indigo) 0%,#4B3F90 60%,var(--violet) 130%)}
header.top .brandname{flex:1;color:#fff}
header.top .model{display:block;font-size:16px;color:#E9E4F5;font-weight:400}
header.top .btn.secondary{background:transparent;color:#fff;border-color:#fff}
header.top .btn.secondary:hover{background:rgba(255,255,255,.18)}
header.top .btn:not(.secondary){background:var(--pink);border-color:var(--pink);color:var(--indigo-dark);box-shadow:none}
header.top .btn:not(.secondary):hover{background:#FFC9CD;border-color:#FFC9CD}
header.top :focus-visible{outline-color:#fff}
.stripe{display:flex;height:8px;background:var(--indigo)}
.stripe i{flex:1}.stripe i:nth-child(1){background:var(--pink)}.stripe i:nth-child(2){background:var(--mauve)}
.stripe i:nth-child(3){background:var(--violet)}.stripe i:nth-child(4){background:var(--indigo-dark)}

/* Buttons: raised pill = signifier of pressable. States: default/hover/focus/active/disabled */
.btn{font:inherit;font-weight:700;min-height:48px;padding:var(--s2) var(--s4);border-radius:999px;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);box-shadow:var(--shadow)}
.btn:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn:active{transform:translateY(2px);box-shadow:none;background:#1F1D4D}
.btn.secondary{background:var(--surface);color:var(--brand);box-shadow:none}
.btn.secondary:hover{background:var(--pink-soft)}
.btn.small{min-height:44px;font-size:16px;padding:var(--s1) var(--s3)}
.btn[disabled],.btn[aria-disabled="true"]{background:#E6E3EC;border-color:#E6E3EC;color:#5E5A73;cursor:not-allowed;transform:none;box-shadow:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.btn.block{width:100%}
.btn.wrong,.btn.wrong:hover{background:var(--err-bg);border-color:var(--err);color:var(--err);box-shadow:none}

/* Main sheet rises over the hero (figure-ground) */
main{flex:1;padding:var(--s4) var(--s3) var(--s3);background:var(--surface);border-radius:28px 28px 0 0;position:relative}
.stephead{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3);padding:var(--s3);background:var(--pink-soft);border-radius:var(--r)}
.stephead .ringprog{flex:0 0 auto}
.stepcount{font-size:16px;color:var(--muted);margin-bottom:var(--s1);display:block}

/* Home */
.homecard{display:flex;gap:var(--s3);align-items:center;background:var(--pink-soft);border-radius:var(--r);padding:var(--s3);margin-bottom:var(--s4)}
.homeicon,.taskico{flex:0 0 auto;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--mauve))}
.card{border:2px solid var(--line);border-radius:var(--r);padding:var(--s3);margin-bottom:var(--s3);background:var(--surface)}
.taskbtn{width:100%;text-align:start;font:inherit;background:var(--surface);border:2px solid var(--brand);border-radius:var(--r);padding:var(--s3);cursor:pointer;color:var(--ink);display:flex;gap:var(--s3);align-items:center;margin-bottom:var(--s2);box-shadow:var(--shadow)}
.taskbtn:hover{background:var(--pink-soft)}
.taskbtn .go{margin-inline-start:auto;font-size:28px;color:var(--brand);font-weight:700}
[dir="rtl"] .taskbtn .go{transform:scaleX(-1)}
.taskbtn[disabled]{border-color:var(--line);color:#5E5A73;cursor:not-allowed;background:var(--bg);box-shadow:none}
.taskbtn[disabled] .taskico{background:#E6E3EC}
.taskbtn strong{display:block;font-size:var(--t2);color:var(--indigo-dark)}
.taskbtn[disabled] strong{color:#5E5A73}

/* Camera stage */
.stage{position:relative;width:100%;aspect-ratio:3/4;background:#30363D;border-radius:20px;overflow:hidden;margin-bottom:var(--s3);border:3px solid var(--indigo)}
.stage video,.stage svg.machine{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage.placing{cursor:crosshair;touch-action:manipulation}
.stage.placing .ring,.stage.placing .tag{pointer-events:none}
.stage .mode{position:absolute;bottom:var(--s2);inset-inline-start:var(--s2);background:rgba(31,29,61,.82);color:#fff;font-size:16px;padding:2px var(--s2);border-radius:999px;z-index:3}
.ring{position:absolute;border:4px solid #fff;border-radius:14px;box-shadow:0 0 0 3px rgba(0,0,0,.65),inset 0 0 0 3px rgba(0,0,0,.35);z-index:2;transition:border-color .2s}
.ring.searching{border-style:dashed;animation:pulse 1.2s infinite}
.ring.found{border-color:#7CF29A}
.ring.bad{border-color:#FF8A80}
.ring.pick{cursor:pointer;background:rgba(255,255,255,.08)}
.ring.pick:hover{background:rgba(255,255,255,.2)}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.ring.searching{animation:none}.status.loading .ico{animation:none!important}}
.fullline{position:absolute;border-top:5px dashed #fff;box-shadow:0 2px 0 rgba(0,0,0,.6),0 -2px 0 rgba(0,0,0,.6);z-index:2}
.tag{position:absolute;z-index:3;background:#fff;color:var(--ink);border-radius:10px;padding:2px var(--s2);font-size:16px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.5);max-width:70%}
.tag.normal{border-inline-start:6px solid var(--ok)}
.tag.bad{border-inline-start:6px solid var(--err)}

/* Status / feedback messages: one style per meaning (similarity) */
.status{border-radius:var(--r);padding:var(--s3);margin-bottom:var(--s3);border:2px solid transparent;display:flex;gap:var(--s2);align-items:flex-start}
.status .ico{font-weight:800;flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:16px}
.status.info{background:var(--pink-soft);border-color:var(--pink)}
.status.info .ico{background:var(--indigo);color:#fff}
.status.ok{background:var(--ok-bg);border-color:var(--ok)}
.status.ok .ico{background:var(--ok);color:#fff}
.status.err{background:var(--err-bg);border-color:var(--err)}
.status.err .ico{background:var(--err);color:#fff}
.status.loading{background:var(--pink-soft);border-color:var(--line)}
.status.loading .ico{border:3px solid var(--line);border-top-color:var(--indigo);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status p{margin:0}
.status .actions{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2)}
.caution{background:var(--warn-bg);border-inline-start:6px solid var(--warn);padding:var(--s2) var(--s3);border-radius:10px;margin-bottom:var(--s3);color:#3D2900}
.caution strong{color:var(--warn)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-bottom:var(--s3)}
.check{display:flex;gap:var(--s2);align-items:center;min-height:48px;padding:var(--s2) var(--s3);border:2px solid var(--line);border-radius:var(--r);margin-bottom:var(--s2);cursor:pointer}
.check:has(input:checked){border-color:var(--indigo);background:var(--pink-soft)}
.check input{width:24px;height:24px;accent-color:var(--indigo)}

/* Bottom action bar stays in view (visibility) */
.navrow{display:flex;gap:var(--s2);margin-top:var(--s3);position:sticky;bottom:0;background:var(--surface);padding:var(--s3) 0 var(--s2);z-index:5;border-top:1px solid var(--line)}
.navrow .btn{flex:1}

.bigcheck{width:96px;height:96px;border-radius:50%;margin:0 auto var(--s3);display:grid;place-items:center;font-size:48px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--ok),#2E8B4B)}

/* Dialog: Is this normal? */
dialog{border:none;border-radius:24px;padding:0;max-width:480px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(31,29,61,.65)}
.dlg{padding:var(--s4) var(--s3) var(--s3);border-top:8px solid var(--pink)}
.dlg h2{margin-bottom:var(--s2)}
.dlg .list button{margin-bottom:var(--s2)}
.empty{border:2px dashed var(--mauve);border-radius:var(--r);padding:var(--s3);color:var(--muted);margin-bottom:var(--s3);background:var(--pink-soft)}

/* Wizard-of-Oz facilitator panel (clearly separated, not part of the user UI) */
.wizard{border-top:4px dashed #8A6D00;background:#FFFBEA;padding:var(--s3);font-size:16px}
.wizard h3{font-size:16px;color:#5A4500;margin-bottom:var(--s2)}
.wizard .row{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s2)}
.wizard .btn{min-height:44px;font-size:16px;background:#5A4500;border-color:#5A4500;box-shadow:none}
.wizard .btn.secondary{background:#fff;color:#5A4500}
footer.foot{padding:var(--s2) var(--s3);font-size:16px;color:var(--muted);background:var(--surface);border-top:1px solid var(--line);display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brandname"><span data-t="appname">Konnect</span><span class="model" data-t="model">Panasonic NA-F135A1 washing machine</span></h1>
    <button class="btn secondary small" id="langBtn" type="button" lang="ur">اردو</button>
    <button class="btn small" id="normalBtn" type="button" data-t="isNormalBtn">Is this normal?</button>
  </header>
  <div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <main id="main" tabindex="-1"></main>

  <div id="live" class="visually-hidden" aria-live="polite"></div>

  <footer class="foot">
    <button class="btn secondary small" type="button" id="wizToggle" aria-expanded="false" aria-controls="wizard">Facilitator controls (Wizard-of-Oz)</button>
    <span>D4 prototype · Team 05 Konnect</span>
  </footer>
  <section class="wizard" id="wizard" hidden aria-label="Facilitator controls">
    <h3>Facilitator (Wizard-of-Oz) — simulates part recognition. Not part of the user interface.</h3>
    <div class="row">
      <label><input type="checkbox" id="wizAuto" checked> Drawing mode: auto-recognise after 2 s (live camera: you tap to place the ring)</label>
    </div>
    <div class="row">
      <button class="btn small" type="button" id="wizFound">Recognised</button>
      <button class="btn small secondary" type="button" id="wizMiss">Not recognised</button>
      <button class="btn small secondary" type="button" id="wizClick">Lid click heard</button>
      <button class="btn small secondary" type="button" id="wizFail">Make next check fail</button>
    </div>
    <div class="row">
      <button class="btn small secondary" type="button" id="wizCam">Force drawing mode</button>
      <button class="btn small secondary" type="button" id="wizReset">Reset to home</button>
      <button class="btn small secondary" type="button" id="wizLog">Download session log</button>
    </div>
  </section>
</div>

<dialog id="normalDlg" aria-labelledby="normalTitle">
  <div class="dlg" id="normalBody"></div>
</dialog>

  drum:{x:14,y:42,w:72,h:54}, line:{x:16,y:55,w:68},

const box=(g)=>`left:${g.x}%;top:${g.y}%;width:${g.w}%;height:${g.h}%`;

/* Tap-to-place: on the live camera the user puts the ring on the real part once. Every other overlay
   item of that step group (compartments, full line, tags) moves with it. In drawing mode offsets are 0. */
const ANCH={tray:"tray",main:"tray",soft:"tray",drum:"drum",line:"drum",display:"display",
            panel:"panel",program:"panel",water:"panel",power:"panel",lid:"lid"};
const STEP_ANCH={1:"tray",2:"tray",3:"drum",4:"display",5:"panel",6:"lid"};
const ctr=a=>({x:G[a].x+G[a].w/2,y:G[a].y+(G[a].h||0)/2});
const clampD=(a,dx,dy)=>{const g=G[a];return{dx:Math.max(-g.x,Math.min(100-g.x-g.w,dx)),dy:Math.max(-g.y,Math.min(100-g.y-g.h,dy))};};
function offFor(a){
  if(S.camera!=="live")return{dx:0,dy:0};
  if(S.screen==="step"&&S.recog==="searching"&&a===STEP_ANCH[S.step]&&S.cursor){const c=ctr(a);return clampD(a,S.cursor.x-c.x,S.cursor.y-c.y);}
  return S.off[a]||{dx:0,dy:0};
}
function Gs(k){const g=G[k],o=offFor(ANCH[k]);return{...g,x:g.x+o.dx,y:g.y+o.dy};}

/* Mock backend (static, runs in the page): event log in localStorage + simulated recognition service */

  localStorage.setItem("konnect_log",JSON.stringify(L.slice(-300)));}catch(e){}}

const S = {screen:"home", step:0, camera:"unknown", stream:null, forceDraw:false,
           recog:"idle", pick:null, load:null, c1:false, c2:false, started:"no", timer:null,
           off:{}, cursor:null, forceMiss:false};

/* ================= CAMERA (genuinely built) ================= */
async function ensureCamera(){
  if(S.forceDraw){S.camera="draw";return;}
  if(S.stream){S.camera="live";return;}
  if(!navigator.mediaDevices?.getUserMedia){S.camera="off";return;}
  S.camera="loading"; render();
  try{
    S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    S.camera="live";
  }catch(e){S.camera="off";}
  render();
}
function stageHTML(overlay){
  const isLive=S.camera==="live";
  const bg = isLive ? `<video id="vid" autoplay playsinline muted aria-hidden="true"></video>` : MACHINE_SVG;
  const placing=isLive&&S.recog==="searching";
  return `<div class="stage${placing?" placing":""}" role="group" ${placing?'tabindex="0"':""} aria-label="${placing?t("place",partName()):isLive?t("modeCam"):t("modeDraw")}">
    ${bg}<span class="mode" aria-hidden="true">${isLive?"● "+t("modeCam"):t("modeDraw")}</span>${overlay||""}</div>`;
}
function attachVideo(){const v=document.getElementById("vid");if(v&&S.stream){v.srcObject=S.stream;}}

/* ================= RECOGNITION (Wizard-of-Oz) ================= */
function startRecog(){
  clearTimeout(S.timer); S.recog="searching";
  const live=S.camera==="live", a=STEP_ANCH[S.step];
  if(live){const c=ctr(a),o=S.off[a];S.cursor=o?{x:c.x+o.dx,y:c.y+o.dy}:c;}
  render();
  announce(live?t("place",partName()):t("looking",partName()));
  /* Drawing mode: positions are exact, so recognition is simulated by a timer. Live mode: the user places the ring. */
  if(!live && document.getElementById("wizAuto").checked){S.timer=setTimeout(()=>setRecog("found"),2000);}
}
function placeAt(pt){
  if(S.screen!=="step"||S.recog!=="searching"||S.camera!=="live")return;
  const a=STEP_ANCH[S.step],c=ctr(a);
  S.off[a]=clampD(a,pt.x-c.x,pt.y-c.y);
  S.recog="checking"; log("place",{anchor:a}); render(); focusEl("#statusMsg");
  announce(t("checking",partName()));
  mockRecognise().then(r=>{if(S.recog==="checking")setRecog(r.ok?"found":"miss");});
}
function moveCursorRing(){
  const a=STEP_ANCH[S.step],c=ctr(a),o=clampD(a,S.cursor.x-c.x,S.cursor.y-c.y);
  S.cursor={x:c.x+o.dx,y:c.y+o.dy};
  const r=main.querySelector(".stage .ring.searching");
  if(r){r.style.left=(G[a].x+o.dx)+"%";r.style.top=(G[a].y+o.dy)+"%";}
}
function setRecog(v){
  clearTimeout(S.timer);
  if(S.screen!=="step")return;
  if(S.step===6 && S.started==="waiting" && v==="found"){heardClick();return;}
  if(S.camera==="live"&&S.recog==="searching"&&v==="found"&&S.cursor){
    const a=STEP_ANCH[S.step],c=ctr(a);S.off[a]=clampD(a,S.cursor.x-c.x,S.cursor.y-c.y);}
  S.recog=v; log("recog",{result:v}); render();
  announce(v==="found"?t("found",partName()):t("notFound",partName()));
  if(v==="miss")focusEl("#statusMsg");
}
function partName(){return t("s"+S.step+"p");}

/* ================= RENDER ================= */
function statusBox(kind,text,actions=""){
  const ico={ok:"✓",err:"!",info:"i",loading:""}[kind];
  return `<div class="status ${kind}" id="statusMsg" tabindex="-1" ${kind==="err"?'role="alert"':''}>
    <span class="ico" aria-hidden="true">${ico}</span><div><p>${text}</p>${actions?`<div class="actions">${actions}</div>`:""}</div></div>`;
}
function progress(){
  const C=2*Math.PI*26, d=C*(S.step/STEPS);
  return `<svg class="ringprog" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
    <circle cx="32" cy="32" r="26" fill="#fff" stroke="#F9B1B6" stroke-width="7"/>
    <circle cx="32" cy="32" r="26" fill="none" stroke="#3F3D8A" stroke-width="7" stroke-linecap="round" stroke-dasharray="${d} ${C}" transform="rotate(-90 32 32)"/>
    <text x="32" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#2E2C6B" font-family="system-ui,sans-serif">${S.step}/${STEPS}</text></svg>`;
}
function render(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ur"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  const lb=document.getElementById("langBtn");
  lb.textContent=lang==="en"?"اردو":"English"; lb.lang=lang==="en"?"ur":"en";
  lb.setAttribute("aria-label",lang==="en"?"Switch to Urdu":"انگریزی میں تبدیل کریں");
  if(S.screen==="home")return renderHome();
  if(S.screen==="done")return renderDone();
  renderStep();
}

function camStatus(){

function recogStatus(){

     `<button class="btn small" type="button" data-act="placehere">${t("placeHere")}</button>`);
  if(S.recog==="searching")return statusBox("loading",t("looking",partName()));

function ring(g,cls,label,extra=""){
  return `<div class="ring ${cls}" style="${box(g)}" ${extra}></div>`+(label?`<span class="tag ${cls==="bad"?"bad":"normal"}" style="left:${g.x}%;top:calc(${g.y+g.h}% + 4px)">${label}</span>`:"");

function renderStep(){
  const n=S.step, found=S.recog==="found";
  const rc = S.recog==="searching"?"searching":found?"found":S.recog==="miss"?"bad":"searching";
  let overlay="", body="", canNext=false, caution="";
  const cam=camStatus();
  if(n===1){
    overlay=ring(Gs("tray"),rc,found?t("s1tag"):"");
    body=recogStatus()||(found?statusBox("ok",t("found",partName())):"");
    caution=t("s1c"); canNext=found;
  }
  if(n===2){
    if(found){
      const mc=S.pick==="main"?"found":S.pick==="soft"?"":"pick", sc=S.pick==="soft"?"bad":"pick";
      overlay=`<button class="ring ${mc} pick" style="${box(Gs("main"))}" data-pick="main" aria-hidden="true" tabindex="-1"></button>

               <span class="tag ${S.pick==="soft"?"bad":"normal"}" style="left:${Gs("soft").x+2}%;top:${Gs("soft").y+Gs("soft").h+8}%">${t("soft")}</span>`;

      if(S.pick==="main")body+=statusBox("ok",t("s2ok"));
      if(S.pick==="soft")body+=statusBox("err",t("s2err"));
    }else{overlay=ring(Gs("tray"),rc,"");body=recogStatus();}
    caution=t("s2c"); canNext=S.pick==="main";
  }
  if(n===3){
    overlay=ring(Gs("drum"),rc,"")+(found?`<div class="fullline" style="left:${Gs("line").x}%;top:${Gs("line").y}%;width:${Gs("line").w}%"></div>
      <span class="tag normal" style="left:${Gs("line").x}%;top:calc(${Gs("line").y}% - 34px)">${t("s3tag")}</span>`:"");
    if(found){
      body=`<h3 style="margin-bottom:8px">${t("s3q")}</h3><div class="choice">
        <button class="btn ${S.load==="below"?"":"secondary"}" type="button" data-load="below" aria-pressed="${S.load==="below"}">${t("below")}</button>
        <button class="btn ${S.load==="above"?"wrong":"secondary"}" type="button" data-load="above" aria-pressed="${S.load==="above"}">${t("above")}</button></div>`;
      if(S.load==="below")body+=statusBox("ok",t("s3ok"));
      if(S.load==="above")body+=statusBox("err",t("s3err"),`<button class="btn small" type="button" data-act="recheck">${t("checkAgain")}</button>`);
    }else body=recogStatus();
    caution=t("s3c"); canNext=S.load==="below";
  }
  if(n===4){
    overlay=ring(Gs("display"),rc,found?t("s4tag"):"");
    body=recogStatus()||(found?statusBox("ok",t("s4ok")):"");
    canNext=found;
  }
  if(n===5){
    if(found){
      overlay=ring(Gs("program"),"found","")+ring(Gs("water"),"found","")+
        `<span class="tag normal" style="left:40%;top:${Gs("program").y+Gs("program").h+2}%">${t("s5tagA")}</span>
         <span class="tag normal" style="left:52%;top:${Gs("program").y+Gs("program").h+11}%">${t("s5tagB")}</span>`;
      body=`<label class="check"><input type="checkbox" id="c1" ${S.c1?"checked":""}> ${t("s5c1")}</label>
            <label class="check"><input type="checkbox" id="c2" ${S.c2?"checked":""}> ${t("s5c2")}</label>
            ${S.c1&&S.c2?statusBox("ok","✓ "+t("s5t")):`<p id="hint" style="color:var(--muted)">${t("s5hint")}</p>`}`;
    }else{overlay=ring(Gs("panel"),rc,"");body=recogStatus();}
    canNext=found&&S.c1&&S.c2;
  }
  if(n===6){
    caution=t("s6c");
    const lidRing=(cls,label)=>S.camera==="live"?(label?`<span class="tag normal" style="left:4%;top:18%">${label}</span>`:""):ring(Gs("lid"),cls,label);
    if(S.started==="no"){overlay=lidRing("pick","");body=`<button class="btn block" type="button" data-act="pressed">${t("pressed")}</button>`;}
    else if(S.started==="waiting"){overlay=lidRing("searching","");body=statusBox("loading",t("listening"));}
    else{overlay=lidRing("found",t("s6tag"))+`<span class="tag normal" style="left:${Gs("display").x}%;top:${Gs("display").y+Gs("display").h+1}%">32 ↓</span>`;
         body=statusBox("ok",t("s6ok"));}
    canNext=S.started==="done";
  }
  main.innerHTML=`<div class="stephead">${progress()}<div><span class="stepcount">${t("stepOf",n,STEPS)}</span>
    <h2 id="screenTitle" tabindex="-1">${t("s"+n+"t")}</h2></div></div>
    <p>${t("s"+n+"i")}</p>
    ${cam}
    ${S.camera==="loading"?"":stageHTML(overlay)}
    ${caution?`<div class="caution"><strong><span aria-hidden="true">⚠ </span>${lang==="ur"?"احتیاط: ":"Caution: "}</strong>${caution}</div>`:""}
    ${body}
    ${S.camera==="live"&&S.recog==="found"&&n<6?`<button class="btn small secondary" type="button" data-act="move">${t("moveRing")}</button> `:""}
    ${S.camera==="live"?`<button class="btn small secondary" type="button" data-act="draw">${t("useDrawing")}</button>`:
      (S.forceDraw?`<button class="btn small secondary" type="button" data-act="cam">${t("useCamera")}</button>`:"")}
    ${navRow(canNext,n===STEPS)}`;
  attachVideo();
  wireStep(canNext);
}
function wireStep(canNext){
  document.getElementById("backBtn").onclick=()=>S.step===1?goHome():goStep(S.step-1);
  document.getElementById("nextBtn").onclick=()=>{
    if(!canNext){focusEl("#statusMsg")||focusEl("#hint");announce(S.step===5?t("s5hint"):t("looking",partName()));return;}
    S.step===STEPS?goDone():goStep(S.step+1);
  };
  main.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==="retry"||a==="move")startRecog();
    if(a==="placehere")placeAt(S.cursor);
    if(a==="draw"){stopCam();S.forceDraw=true;S.camera="draw";log("fallback-drawing");startRecog();}
    if(a==="cam"){S.forceDraw=false;ensureCamera().then(startRecog);}
    if(a==="recheck"){S.load=null;render();focusEl("[data-load=below]");}
    if(a==="pressed"){S.started="waiting";render();announce(t("listening"));
       if(document.getElementById("wizAuto").checked)S.timer=setTimeout(heardClick,2000);}
  });
  const st=main.querySelector(".stage.placing");
  if(st){
    st.onclick=e=>{const r=st.getBoundingClientRect();placeAt({x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100});};
    st.onkeydown=e=>{
      const d={ArrowLeft:[-3,0],ArrowRight:[3,0],ArrowUp:[0,-3],ArrowDown:[0,3]}[e.key];
      if(d){e.preventDefault();S.cursor={x:S.cursor.x+d[0],y:S.cursor.y+d[1]};moveCursorRing();}
      else if(e.key==="Enter"||e.key===" "){e.preventDefault();placeAt(S.cursor);}
    };
  }
  main.querySelectorAll("button.btn[data-pick]").forEach(b=>b.onclick=()=>pick(b.dataset.pick));
  main.querySelectorAll(".ring[data-pick]").forEach(b=>b.onclick=()=>pick(b.dataset.pick));
  main.querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>{S.load=b.dataset.load;log("load",{v:S.load});render();
    announce(S.load==="below"?t("s3ok"):t("s3err"));focusEl(S.load==="above"?"#statusMsg":"#nextBtn");});
  ["c1","c2"].forEach(id=>{const c=document.getElementById(id);if(c)c.onchange=()=>{S[id]=c.checked;render();focusEl("#"+id);
    if(S.c1&&S.c2)announce(t("s5t")+" ✓");};});
}
function pick(v){S.pick=v;log("pick",{v});render();announce(v==="main"?t("s2ok"):t("s2err"));focusEl(v==="soft"?"#statusMsg":"#nextBtn");}
function heardClick(){clearTimeout(S.timer);if(S.step!==6)return;S.started="done";log("lidclick");render();announce(t("s6ok"));focusEl("#statusMsg");}
function renderDone(){
  main.innerHTML=`<div class="bigcheck" aria-hidden="true">✓</div>${statusBox("ok",`<strong style="font-size:var(--t1)">${t("doneT")}</strong>`)}
   <h2 id="screenTitle" tabindex="-1" class="visually-hidden">${t("doneT")}</h2>
   <p>${t("doneP")}</p>
   <div class="navrow"><button class="btn" type="button" id="againBtn">${t("again")}</button>
   <button class="btn secondary" type="button" id="homeBtn">${t("home")}</button></div>`;
  document.getElementById("againBtn").onclick=()=>goStep(1);
  document.getElementById("homeBtn").onclick=goHome;
}
function focusEl(sel){const e=document.querySelector(sel);if(e){e.focus();return true;}return false;}

/* ================= NAVIGATION ================= */
async function goStep(n){
  clearTimeout(S.timer);
  S.screen="step"; S.step=n; S.recog="idle";
  if(n===2)S.pick=null; if(n===3)S.load=null; if(n===5){S.c1=false;S.c2=false;} if(n===6)S.started="no";
  await ensureCamera();
  log("step",{n});
  /* Live camera: if this part group was already placed (e.g. tray for step 2), keep it instead of asking again */
  if(n===6){S.recog="found";render();}
  else if(S.camera==="live"&&S.off[STEP_ANCH[n]]){S.recog="found";render();}
  else startRecog();
  focusEl("#screenTitle");
}
function goHome(){clearTimeout(S.timer);S.screen="home";S.step=0;render();focusEl("#screenTitle");}
function goDone(){S.screen="done";log("done");render();announce(t("doneT"));focusEl("#statusMsg");}
function stopCam(){if(S.stream){S.stream.getTracks().forEach(x=>x.stop());S.stream=null;}}

/* ================= IS THIS NORMAL? (global dialog) ================= */
const dlg=document.getElementById("normalDlg"), dbody=document.getElementById("normalBody");
let opener=null;
function openNormal(){opener=document.activeElement;renderNormalList();dlg.showModal();dbody.querySelector("h2").focus();}
function renderNormalList(){
  dbody.innerHTML=`<h2 id="normalTitle" tabindex="-1">${t("nTitle")}</h2><p>${t("nIntro")}</p>
   <div class="empty">${t("nEmpty")}</div>
   <div class="list">
    <button class="btn secondary block" type="button" data-n="32">${t("n32")}</button>
    <button class="btn secondary block" type="button" data-n="Click">${t("nClick")}</button>
    <button class="btn secondary block" type="button" data-n="Count">${t("nCount")}</button>
    <button class="btn secondary block" type="button" data-n="Other">${t("nOther")}</button></div>
   <button class="btn block" type="button" id="dlgClose">${t("close")}</button>`;
  dbody.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>showAnswer(b.dataset.n));
  document.getElementById("dlgClose").onclick=()=>dlg.close();
}
function showAnswer(k){
  const ok=k!=="Other";
  dbody.innerHTML=`<h2 id="normalTitle" tabindex="-1">${t("n"+k)}</h2>
   ${statusBox(ok?"ok":"info",t("n"+k+"a"))}
   <div class="navrow"><button class="btn secondary" type="button" id="dlgBack">${t("backList")}</button>
   <button class="btn" type="button" id="dlgClose">${t("close")}</button></div>`;
  document.getElementById("dlgBack").onclick=()=>{renderNormalList();dbody.querySelector("h2").focus();};
  document.getElementById("dlgClose").onclick=()=>dlg.close();
  dbody.querySelector("h2").focus(); announce(t("n"+k+"a"));
}
dlg.addEventListener("close",()=>{if(opener)opener.focus();});
document.getElementById("normalBtn").onclick=openNormal;

/* ================= LANGUAGE + WIZARD ================= */
document.getElementById("langBtn").onclick=()=>{lang=lang==="en"?"ur":"en";render();if(dlg.open)renderNormalList();
  document.getElementById("langBtn").focus();announce(lang==="ur"?"اردو":"English");};
const wiz=document.getElementById("wizard"), wt=document.getElementById("wizToggle");
wt.onclick=()=>{wiz.hidden=!wiz.hidden;wt.setAttribute("aria-expanded",String(!wiz.hidden));};
document.getElementById("wizFound").onclick=()=>setRecog("found");
document.getElementById("wizMiss").onclick=()=>setRecog("miss");
document.getElementById("wizClick").onclick=heardClick;
document.getElementById("wizCam").onclick=()=>{stopCam();S.forceDraw=true;S.camera="draw";if(S.screen==="step"){S.recog==="found"?render():startRecog();}};
document.getElementById("wizReset").onclick=()=>{stopCam();S.forceDraw=false;S.camera="unknown";S.off={};goHome();};
document.getElementById("wizFail").onclick=()=>{S.forceMiss=true;announce("Next recognition will fail");};
document.getElementById("wizLog").onclick=()=>{const b=new Blob([localStorage.getItem("konnect_log")||"[]"],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="konnect-session-log.json";a.click();};

render();
</script>
</body>
